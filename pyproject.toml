[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patchora"
version = "0.1.0"
description = "Autonomous Sentry-to-GitHub bug investigation, repair, validation and pull request platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "groq>=0.11",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]
faiss = [
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "fastembed>=0.3",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker: requires a running Docker daemon",
    "faiss: requires the optional faiss extra",
]
filterwarnings = [
    "ignore::DeprecationWarning:jwt.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend"]
extend-exclude = ["backend/app/demo/fixture_repo", "backend/app/evaluation/fixtures", "backend/app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess calls are deliberate and use argv lists (see sandbox/)
    "S607",   # partial executable paths are resolved deliberately inside the sandbox
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012",
    "S311",   # random is used for jitter, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106", "S108", "E501"]
"backend/scripts/**" = ["S105"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["backend/app/demo/fixture_repo/", "backend/app/evaluation/fixtures/"]
